name: Validate template

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  copier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Render Copier template
        shell: bash
        run: |
          destination="$RUNNER_TEMP/generated"
          uvx --from copier==9.17.2 copier copy \
            --vcs-ref HEAD \
            --defaults \
            --data deck_name=ci-test \
            . "$destination"
          test -f "$destination/.marpme/copier-answers.yml"
          test -f "$destination/.marpme/themes/company.css"
          test -f "$destination/.marpme/themes/company-dark.css"
          test -f "$destination/.marpme/starter/deck.md"
          test -f "$destination/.marprc.yml"
          test ! -e "$destination/.vscode"
          test ! -e "$destination/example.md"
      - name: Validate VS Code configuration
        run: |
          jq empty .vscode/extensions.json
          jq empty .vscode/settings.json
          jq empty .vscode/tasks.json
          grep -Fx "themeSet: ./.marpme/themes" .marprc.yml
          grep -Fx "allowLocalFiles: true" .marprc.yml
      - name: Validate changelog
        shell: bash
        run: |
          test -s CHANGELOG.md
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            grep -Eq "^## (v)?${version//./\\.}( |$)" CHANGELOG.md
          fi

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: copier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
